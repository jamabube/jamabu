<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img"
     aria-label="Vehicle Access Monitoring System">
  <!--
    The same shield and check as the favicon, drawn on a larger canvas so the
    strokes stay true at hero size instead of being scaled up from 32px.

    The plate carries the brand colour and the mark is knocked out of it in
    white, so the logo reads on both the light card and the dark hero panel
    without needing a second variant.
  -->
  <defs>
    <linearGradient id="vams-logo-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238a52"/>
      <stop offset="1" stop-color="#175634"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#vams-logo-plate)"/>

  <path d="M48 18l21 9v18.6c0 13.2-8.4 25.2-21 29.4-12.6-4.2-21-16.2-21-29.4V27l21-9z"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>

  <path d="M37.5 48.6l7.8 7.8 13.8-15.6" fill="none" stroke="#ffffff"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
